version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./exports:/app/exports:ro
    depends_on:
      - backend
      - frontend
    networks:
      - archviz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/dist:/app/dist
    command: ["npm", "run", "build"]
    networks:
      - archviz-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./assets:/app/assets
    environment:
      - DATABASE_URL=postgresql://archviz:archviz@db:5432/archviz
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - EXPORT_DIR=/app/exports
      - VIDEO_OUTPUT_DIR=/app/exports/videos
    depends_on:
      - db
      - redis
    networks:
      - archviz-network

  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: archviz
      POSTGRES_PASSWORD: archviz
      POSTGRES_DB: archviz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - archviz-network

  redis:
    image: redis:7-alpine
    networks:
      - archviz-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.services.video_generator", "worker", "--loglevel=info"]
    volumes:
      - ./exports:/app/exports
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VIDEO_OUTPUT_DIR=/app/exports/videos
    depends_on:
      - redis
      - db
    networks:
      - archviz-network

volumes:
  postgres_data:

networks:
  archviz-network:
    driver: bridge
